<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification - VitalScale</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            text-align: center;
        }
        .badge-21 {
            width: 110px;
            height: 110px;
            background-color: #dc2626;
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .btn-yes {
            background-color: #15803d;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(21, 128, 61, 0.3);
            transition: 0.2s;
        }
        .btn-yes:hover { background-color: #166534; }
        .btn-no {
            background-color: #dc2626;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 35px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
            transition: 0.2s;
        }
        .btn-no:hover { background-color: #b91c1c; }
        .footer-note {
            font-size: 12.5px;
            font-weight: 600;
            color: #6b7280;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge-21">21+</div>
        <h1>Age Verification</h1>
        <p>Are you over 21 years of age?</p>

        <div class="btn-group">
            <!-- 'Yes' पर क्लिक करने पर यूज़र main.html पर चला जाएगा -->
            <button class="btn-yes" onclick="verifyAge()">Yes, I'm 21+</button>
            <a href="#" class="btn-no" onclick="alert('You must be 21+ to access this website.'); return false;">NO</a>
        </div>

        <div class="footer-note">
            * This site is intended only for individuals over 21 years of age.
        </div>
    </div>

    <script>
        function verifyAge() {
            // सेशन स्टोर में सेव कर लेंगे ताकि बार-बार वेरिफिकेशन न मांगें
            sessionStorage.setItem('apar_age_verified', 'true');
            // मुख्य वेबसाइट पर रीडायरेक्ट करें
            window.location.href = 'main.html';
        }
    </script>
</body>
</html>
